sonar.projectKey=ifs24017-pabwe2026-sk-p5-nuxt
sonar.projectName=ifs24017-pabwe2026-sk-p5-nuxt

# Bahasa dan Ekstensi Berkas
sonar.sourceEncoding=UTF-8
sonar.sources=src
sonar.tests=src

# Inklusi spesifik agar komponen Vue dan TypeScript dianalisis
sonar.inclusions=src/**/*.ts,src/**/*.js,src/**/*.vue
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.js

# Coverage Report Vitest (LCOV)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Eksklusi yang rapi tanpa membuang file logika utama
sonar.exclusions=node_modules/**,dist/**,.output/**,.nuxt/**,coverage/**,src/**/*.test.ts,src/**/*.test.js,src/**/*.d.ts
sonar.coverage.exclusions=src/**/*.test.ts,src/**/*.test.js,src/**/*.d.ts,src/app.vue,src/app.html